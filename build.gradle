
apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.autogamer'
version = '1.0.0'

expoModule {
    canBePublished false
}

android {
    namespace "expo.modules.autogamer"

    defaultConfig {
        versionCode 1
        versionName "1.0.0"
    }
}

dependencies {
    implementation 'com.facebook.react:react-android'
}
